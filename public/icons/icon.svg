<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Town Center">
  <title>Town Center</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#ededed" />
      <stop offset="1" stop-color="#c4c4c4" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#field)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" />

  <!-- Roman II, drawn as slab-serif geometry so it never depends on a font. -->
  <g fill="url(#mark)">
    <rect x="160" y="156" width="84" height="22" rx="5" />
    <rect x="182" y="156" width="40" height="200" rx="6" />
    <rect x="160" y="334" width="84" height="22" rx="5" />

    <rect x="268" y="156" width="84" height="22" rx="5" />
    <rect x="290" y="156" width="40" height="200" rx="6" />
    <rect x="268" y="334" width="84" height="22" rx="5" />
  </g>
</svg>
