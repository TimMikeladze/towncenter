<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Town Center">
  <title>Town Center</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c" />
      <stop offset="1" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#ededed" />
      <stop offset="1" stop-color="#c4c4c4" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full bleed: the launcher supplies the mask. The mark stays inside the
       inner 80% safe zone so no platform's crop can clip it. -->
  <rect width="512" height="512" fill="url(#field)" />
  <rect width="512" height="512" fill="url(#glow)" />

  <g fill="url(#mark)">
    <rect x="171" y="171" width="72" height="19" rx="4" />
    <rect x="190" y="171" width="34" height="170" rx="5" />
    <rect x="171" y="322" width="72" height="19" rx="4" />

    <rect x="269" y="171" width="72" height="19" rx="4" />
    <rect x="288" y="171" width="34" height="170" rx="5" />
    <rect x="269" y="322" width="72" height="19" rx="4" />
  </g>
</svg>
